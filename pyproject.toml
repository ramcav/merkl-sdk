[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merkl-sdk"
version = "0.1.1"
readme = "README.md"
description = "Record AI agent actions as independently verifiable cryptographic proofs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Merkl", email = "hello@merkl.ai" }]
keywords = ["ai", "agents", "audit", "merkle", "compliance", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "uuid6>=2025.0.1",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://merkl.ai"
Documentation = "https://merkl.ai"
Repository = "https://github.com/ramcav/merkl-sdk"
"Bug Tracker" = "https://github.com/ramcav/merkl-sdk/issues"

[project.scripts]
merkl = "merkl.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.hypothesis",
    "/.pytest_cache",
    "/.ruff_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["merkl"]

[tool.hatch.build.targets.wheel.force-include]
"INSTALL.md" = "merkl/INSTALL.md"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
