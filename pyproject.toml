[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merkl-sdk"
version = "0.1.0"
description = "Merkl SDK — thin HTTP client for agent accountability"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "uuid6>=2025.0.1",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["merkl"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
